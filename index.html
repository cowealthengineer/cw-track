<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>竟丞 產品追蹤</title>
<style>
:root{--bg:#eef1f5;--ink:#1d2433;--sub:#5b6577;--blue:#1f6feb}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
  display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.box{background:#fff;border-radius:12px;padding:24px;max-width:420px;width:100%;text-align:center}
.b{font-size:24px;font-weight:700;margin:6px 0}.s{color:var(--sub);font-size:15px}
a{color:var(--blue)}
</style></head><body>
<div class="box"><div class="s">產品追蹤</div><div class="b" id="b"></div><div class="s" id="m">連線中…</div></div>
<script>
/* 固定轉址頁：QR 印的是這個網址，永遠不變。
   current.txt 記的是「現在連得到的通道網址」，通道換網址時由公司電腦自動更新（只有這一行，沒有任何資料）。 */
var b = new URLSearchParams(location.search).get('b') || '';
document.getElementById('b').textContent = b;
fetch('current.txt?t=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.text(); }).then(function (u) {
  u = (u || '').trim().replace(/\/+$/, '');
  if (!/^https:\/\//.test(u)) throw 0;
  location.replace(u + (b ? '/t/' + encodeURIComponent(b) : '/track'));
}).catch(function () {
  document.getElementById('m').innerHTML = '系統暫時連不上，請稍後再掃一次。<br>（公司電腦可能正在重新開機）';
});
</script></body></html>
